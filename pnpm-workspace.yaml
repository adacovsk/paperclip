packages:
  - packages/*
  - packages/adapters/*
  - server
  - ui
  - cli

# Supply-chain cooldown: resolve no version, direct or transitive, published
# less than 14 days ago (in minutes). A hijacked release is usually caught and
# unpublished within days; this keeps one out of the lockfile until then.
minimumReleaseAge: 20160

# Exact versions on `pnpm add`, so a manifest entry stays a pin, never a range.
saveExact: true
autoInstallPeers: true

# Dependency install scripts are blocked by default: a script runs with the
# installing user's full access, and a hijacked release's payload usually sits
# in one. Only these may run, each for a reason that was read:
#   @embedded-postgres/*  postinstall recreates the bundled libpq/postgres
#                         symlinks npm cannot ship
#   esbuild               postinstall installs and verifies its native binary
allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-ia32": true
  "@embedded-postgres/linux-ppc64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  esbuild: true

# Security floors for transitive dependencies.
overrides:
  rollup: ">=4.59.0"
  "fast-uri@<3.1.9": "^3.1.9"
  "browserslist@<4.28.7": "^4.28.7"
  "path-to-regexp@>=8.0.0 <8.4.0": "^8.4.0"
  "form-data@>=4.0.0 <4.0.6": "^4.0.6"
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "@babel/core@<7.29.6": "^7.29.6"
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  "qs@<6.16.1": "^6.16.1"
  "baseline-browser-mapping@<2.11.0": "^2.11.0"
  "esbuild@<0.25.0": "^0.25.0"
  "proxy-addr@<2.0.8": "^2.0.8"
  "fast-copy@>=4.0.0 <4.1.0": "^4.1.0"
  "source-map-js@<1.2.2": "^1.2.2"
  "postcss-selector-parser@<7.1.6": "^7.1.6"
  "katex@>=0.11.0 <0.18.2": "^0.18.2"
