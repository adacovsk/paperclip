version: 2

# Why this file exists, and what it does not change.
#
# Dependabot *security* updates were already running here without config.
# *Version* updates need this file, which is what was missing.
#
# THE LOCKFILE NOTE THAT USED TO BE HERE IS OBSOLETE — do not reinstate the
# manual step it prescribed. It said to dispatch `refresh-lockfile.yml` (or run
# `pnpm install --no-frozen-lockfile` locally and commit) after every Dependabot
# merge, because a security bump had edited `server/package.json` without syncing
# `pnpm-lock.yaml` and a clean `--frozen-lockfile` install then failed outright.
# Dependabot now carries its own lockfile in the same PR, and `pr.yml`'s `policy`
# job allows exactly that shape — a lockfile moving alongside the manifest that
# moved it. The pair lands together; there is nothing to sync afterwards.
#
# That note also said Dependabot was the only workflow executing on this fork,
# `push` and `pull_request` producing no runs. True when written, false now:
# `pr.yml` runs `policy`, `verify` and `e2e` on every PR. Which is the point —
# these bumps are typechecked, tested and built before they land.
#
# Grouping below keeps the PR count down.
#
# COOLDOWN. Every ecosystem waits 14 days after a release before proposing it,
# the same age `minimumReleaseAge` in pnpm-workspace.yaml demands of every
# resolved version. A hijacked release is usually caught and unpublished within
# days; a bump proposed sooner would fail that gate anyway. Security updates
# ignore this cooldown and open at once, but their install still meets the
# pnpm gate: a fix younger than 14 days lands only after its package is named
# under `minimumReleaseAgeExclude` in pnpm-workspace.yaml, a deliberate
# exception taken for that one fix and removed once it ages past the window.

updates:
  # Node dependencies. `directory: "/"` covers every pnpm workspace member —
  # server, ui, cli, packages/* — through the root lockfile, so it does not need
  # one entry per package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # These move as a set; ungrouped they arrive as a dozen PRs per release,
      # each needing its own lockfile sync.
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      typescript-toolchain:
        patterns:
          - "typescript"
          - "tsx"
          - "vite"
          - "vitest"
          - "@vitest/*"
      types:
        patterns:
          - "@types/*"
      # pino-http pins pino's major; pino alone fails typecheck on
      # `pinoHttp({ logger })`, so they must arrive in one PR.
      pino:
        patterns:
          - "pino"
          - "pino-*"

  # GitHub Actions versions. The runner already warns that actions/checkout@v4,
  # actions/setup-node@v4 and pnpm/action-setup@v4 target the deprecated Node 20.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  # Base image for the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      # The image's Node major follows `.nvmrc`, and moves with it by hand.
      # A major bump here alone ships a different Node than CI tests on, and
      # Node 25+ no longer bundles corepack, which the Dockerfile enables.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
