name: Docker

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keep the image just pushed and one backup; delete every older version.
      #
      # GHCR lists a multi-platform image as several versions: the tagged index
      # plus an untagged entry per platform build and per attestation. Deleting
      # an untagged entry that a kept index references breaks that image, so
      # "keep the newest N versions" is wrong here. Instead, keep the newest
      # two tagged indexes and everything they reference, and delete the rest:
      # older images, their parts, and orphans from overwritten tags.
      - name: Prune old images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          pkg="${GITHUB_REPOSITORY#*/}"
          api="/users/$OWNER/packages/container/$pkg/versions"
          versions="$(gh api --paginate "$api?per_page=100" \
            -q '.[] | [.id, .name, .created_at, (.metadata.container.tags | length)] | @tsv')"
          keep="$(printf '%s\n' "$versions" | awk -F'\t' '$4 > 0' | sort -t$'\t' -k3,3r | head -2 | cut -f2)"
          [ "$(printf '%s\n' "$keep" | grep -c .)" -ge 1 ] || { echo "no tagged image found; not pruning"; exit 0; }
          refs="$keep"
          for digest in $keep; do
            refs="$refs"$'\n'"$(docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -r '.manifests[]?.digest')"
          done
          printf '%s\n' "$versions" | while IFS=$'\t' read -r id name created tags; do
            if printf '%s\n' "$refs" | grep -qxF "$name"; then
              echo "keep   $name ($created, $tags tag(s))"
            else
              echo "delete $name ($created, $tags tag(s))"
              gh api -X DELETE "$api/$id"
            fi
          done
